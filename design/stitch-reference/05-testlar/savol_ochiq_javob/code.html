<script>
  (function () {
    const display = document.getElementById('display-value');
    let currentValue = '45';

    function updateView() {
      if (!display) return;
      if (currentValue.length === 0) {
        display.textContent = 'Javobni yozing';
        display.classList.add('text-secondary');
        display.classList.remove('text-on-surface');
      } else {
        display.textContent = currentValue;
        display.classList.remove('text-secondary');
        display.classList.add('text-on-surface');
      }
    }

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const char = btn.getAttribute('data-val');
        if (currentValue.length < 8) {
          currentValue += char;
          updateView();
        }
      });
    });

    const backspaceBtn = document.getElementById('key-backspace');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (currentValue.length > 0) {
          currentValue = currentValue.slice(0, -1);
          updateView();
        }
      });
    }

    const clearBtn = document.getElementById('key-clear');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        currentValue = '';
        updateView();
      });
    }

    updateView();
  })();
