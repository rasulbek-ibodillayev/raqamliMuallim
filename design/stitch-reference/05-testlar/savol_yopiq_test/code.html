<script>
  (function() {
    const items = document.querySelectorAll('.option-item');
    items.forEach(item => {
      item.addEventListener('click', () => {
        items.forEach(el => {
          el.setAttribute('aria-checked', 'false');
          el.classList.remove('is-selected', 'bg-secondary-fixed/40');
          el.classList.add('bg-surface-container-lowest');
          
          const label = el.querySelector('span');
          if (label) {
            label.classList.remove('font-semibold');
            label.classList.add('font-medium');
          }
          
          const indicator = el.querySelector('.radio-indicator');
          if (indicator) {
            indicator.classList.remove('bg-primary-container');
            indicator.classList.add('bg-surface-container-lowest');
          }
          
          const dot = el.querySelector('.inner-dot');
          if (dot) dot.classList.add('hidden');
        });

        item.setAttribute('aria-checked', 'true');
        item.classList.add('is-selected', 'bg-secondary-fixed/40');
        item.classList.remove('bg-surface-container-lowest');
        
        const label = item.querySelector('span');
        if (label) {
          label.classList.remove('font-medium');
          label.classList.add('font-semibold');
        }
        
        const indicator = item.querySelector('.radio-indicator');
        if (indicator) {
          indicator.classList.remove('bg-surface-container-lowest');
          indicator.classList.add('bg-primary-container');
        }
        
        const dot = item.querySelector('.inner-dot');
        if (dot) dot.classList.remove('hidden');
      });
    });
  })();
