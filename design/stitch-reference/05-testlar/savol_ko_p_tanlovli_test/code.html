<h1 class="font-headline-sm text-headline-sm text-on-surface mb-space-lg leading-snug">
      Quyidagilardan qaysilari kiritish qurilmalari?
    </h1>
<!-- Multiple Choice Options List -->
<fieldset class="flex flex-col gap-space-sm w-full m-0 p-0 border-0">
<legend class="sr-only">Kiritish qurilmalarini tanlang</legend>
<!-- Option 1: Selected (Klaviatura) -->
<label class="group relative flex items-center min-h-[56px] px-space-lg py-space-md rounded-xl bg-surface-container-low cursor-pointer transition-all">
<input checked="" class="peer sr-only" name="quiz_answers" type="checkbox" value="klaviatura"/>
<div class="w-5 h-5 rounded-lg flex items-center justify-center shrink-0 mr-3.5 bg-primary-container text-on-primary peer-checked:bg-primary-container peer-checked:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface select-none font-medium">Klaviatura</span>
<div class="absolute inset-0 rounded-xl pointer-events-none ring-2 ring-primary-container"></div>
</label>
<!-- Option 2: Unselected (Monitor) -->
<label class="group relative flex items-center min-h-[56px] px-space-lg py-space-md rounded-xl bg-surface-container-lowest cursor-pointer transition-all">
<input class="peer sr-only" name="quiz_answers" type="checkbox" value="monitor"/>
<div class="w-5 h-5 rounded-lg flex items-center justify-center shrink-0 mr-3.5 bg-surface-container-high text-transparent peer-checked:bg-primary-container peer-checked:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface select-none font-normal">Monitor</span>
<div class="absolute inset-0 rounded-xl pointer-events-none ring-1 ring-outline-variant/30 peer-checked:ring-2 peer-checked:ring-primary-container"></div>
</label>

<label class="group relative flex items-center min-h-[56px] px-space-lg py-space-md rounded-xl bg-surface-container-low cursor-pointer transition-all">

<div class="w-5 h-5 rounded-lg flex items-center justify-center shrink-0 mr-3.5 bg-primary-container text-on-primary peer-checked:bg-primary-container peer-checked:text-on-primary transition-colors">

</div>
<span class="font-body-lg text-body-lg text-on-surface select-none font-medium">Sichqoncha</span>

</div>
<span class="font-body-lg text-body-lg text-on-surface select-none font-normal">Printer</span>

</label>

<label class="group relative flex items-center min-h-[56px] px-space-lg py-space-md rounded-xl bg-surface-container-lowest cursor-pointer transition-all">
<input class="peer sr-only" name="quiz_answers" type="checkbox" value="skaner"/>
<div class="w-5 h-5 rounded-lg flex items-center justify-center shrink-0 mr-3.5 bg-surface-container-high text-transparent peer-checked:bg-primary-container peer-checked:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>

</label>
</fieldset>
</main>
<!-- Sticky Bottom Navigation / Submit Bar -->
<div class="sticky bottom-0 w-full bg-surface/95 backdrop-blur-sm px-margin py-space-md">
<button class="w-full h-12 bg-primary-container active:bg-primary text-on-primary font-label-lg text-label-lg font-semibold rounded-xl flex items-center justify-center tracking-normal transition-colors" type="button">
      Keyingisi
    </button>
</div>
</div>
<script>
  // Dynamic card state toggle micro-interaction for testing experience
  document.querySelectorAll('input[name="quiz_answers"]').forEach((checkbox) => {
    checkbox.addEventListener('change', (e) => {
      const label = e.target.closest('label');
      const box = label.querySelector('div:first-of-type');
      const text = label.querySelector('span');
      const ring = label.querySelector('div:last-of-type');

      if (e.target.checked) {
        label.classList.remove('bg-surface-container-lowest');
        label.classList.add('bg-surface-container-low');
        box.classList.remove('bg-surface-container-high', 'text-transparent');
        box.classList.add('bg-primary-container', 'text-on-primary');
        text.classList.remove('font-normal');
        text.classList.add('font-medium');
        ring.classList.remove('ring-1', 'ring-outline-variant/30');
        ring.classList.add('ring-2', 'ring-primary-container');
      } else {
        label.classList.remove('bg-surface-container-low');
        label.classList.add('bg-surface-container-lowest');
        box.classList.remove('bg-primary-container', 'text-on-primary');
        box.classList.add('bg-surface-container-high', 'text-transparent');
        text.classList.remove('font-medium');
        text.classList.add('font-normal');
        ring.classList.remove('ring-2', 'ring-primary-container');
        ring.classList.add('ring-1', 'ring-outline-variant/30');
      }
    });
  });
</script></main></body></html>
