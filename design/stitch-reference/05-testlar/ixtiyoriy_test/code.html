<script>
  (function() {
    const masterCheckbox = document.getElementById('master-checkbox');
    const topicCheckboxes = document.querySelectorAll('.topic-check');
    const selectedCountEl = document.getElementById('selected-count');
    const questionButtons = document.querySelectorAll('.question-btn');
    const timeEstimateEl = document.getElementById('time-estimate');
    const startBtn = document.getElementById('start-btn');

    function updateCount() {
      const checkedBoxes = document.querySelectorAll('.topic-check:checked');
      const totalChecked = checkedBoxes.length;
      if (selectedCountEl) {
        selectedCountEl.textContent = totalChecked + ' ta tanlandi';
      }
      if (startBtn) {
        if (totalChecked === 0) {
          startBtn.disabled = true;
          startBtn.classList.add('opacity-50', 'pointer-events-none');
        } else {
          startBtn.disabled = false;
          startBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      }
      if (masterCheckbox) {
        masterCheckbox.checked = (totalChecked === topicCheckboxes.length);
      }
    }

    if (masterCheckbox) {
      masterCheckbox.addEventListener('change', function() {
        topicCheckboxes.forEach(cb => {
          cb.checked = masterCheckbox.checked;
        });
        updateCount();
      });
    }

    topicCheckboxes.forEach(cb => {
      cb.addEventListener('change', updateCount);
    });

    questionButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        questionButtons.forEach(b => {
          b.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'font-semibold');
          b.classList.add('text-on-surface-variant', 'font-medium');
        });
        btn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm', 'font-semibold');
        btn.classList.remove('text-on-surface-variant', 'font-medium');
        
        const time = btn.getAttribute('data-time');
        if (timeEstimateEl && time) {
          timeEstimateEl.textContent = 'Taxminiy vaqt: ' + time;
        }
      });
    });

    updateCount();
  })();
