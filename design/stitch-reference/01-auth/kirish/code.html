<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-high": "#e2e7ff", "on-secondary-container": "#54647a", "on-secondary-fixed-variant": "#38485d", "outline-variant": "#c3c6d7", "primary-container": "#2563eb", "tertiary-fixed-dim": "#ffb596", "on-tertiary": "#ffffff", "secondary-fixed": "#d3e4fe", "error-container": "#ffdad6", "secondary-fixed-dim": "#b7c8e1", "on-tertiary-fixed": "#360f00", "on-primary-fixed-variant": "#003ea8", "on-primary-container": "#eeefff", "secondary-container": "#d0e1fb", "background": "#faf8ff", "tertiary-container": "#bc4800", "on-error": "#ffffff", "on-tertiary-fixed-variant": "#7d2d00", "inverse-primary": "#b4c5ff", "surface-dim": "#d2d9f4", "surface": "#faf8ff", "error": "#ba1a1a", "surface-tint": "#0053db", "surface-container-low": "#f2f3ff", "surface-container-highest": "#dae2fd", "on-surface-variant": "#434655", "surface-container-lowest": "#ffffff", "surface-variant": "#dae2fd", "tertiary-fixed": "#ffdbcd", "inverse-surface": "#283044", "on-primary": "#ffffff", "primary": "#004ac6", "on-secondary-fixed": "#0b1c30", "on-error-container": "#93000a", "outline": "#737686", "on-primary-fixed": "#00174b", "secondary": "#505f76", "on-secondary": "#ffffff", "primary-fixed": "#dbe1ff", "inverse-on-surface": "#eef0ff", "on-surface": "#131b2e", "surface-bright": "#faf8ff", "primary-fixed-dim": "#b4c5ff", "on-background": "#131b2e", "surface-container": "#eaedff", "tertiary": "#943700", "on-tertiary-container": "#ffede6" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-lg": "1rem", "gutter": "1rem", "space-xl": "1.5rem", "space-md": "0.75rem", "margin": "1rem" }, fontFamily: { "code-inline": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"] }, fontSize: { "code-inline": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-md": ["15px", { "lineHeight": "24px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-sm": ["14px", { "lineHeight": "21px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }] } } } };</script><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>

</head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col w-full min-h-screen bg-surface pt-safe pb-safe"><div class="flex flex-col w-full pb-safe">
<!-- Minimal Top Navigation -->
<header class="w-full flex items-center justify-between px-space-lg h-14">
<button aria-label="Orqaga" class="w-10 h-10 -ml-2 rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container transition-colors focus:outline-none" type="button" onclick="history.back()">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="w-10"></div>
</header>
<!-- Main Content Area -->
<div class="w-full px-space-lg flex flex-col pt-2">
<!-- Academic Header -->
<div class="mb-space-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Kirish</h1>
<p class="font-body-md text-body-md text-secondary mt-1">Attestatsiyaga tayyorgarlik tizimi</p>
</div>
<!-- Login Form Card -->
<form class="w-full bg-surface-container-lowest rounded-xl p-space-lg flex flex-col space-y-space-lg" onsubmit="event.preventDefault();">
<!-- Field 1: Phone / Email -->
<div class="flex flex-col space-y-space-sm">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Telefon raqam yoki email</label>
<div class="w-full h-12 bg-surface-container-lowest rounded-xl flex items-center px-space-lg focus-within:bg-surface-container-low transition-colors">
<input class="w-full h-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder-secondary focus:outline-none" id="identifier" name="identifier" placeholder="+998 90 123 45 67" type="text" value="+998 90 452 18 90">
</div>
</div>
<!-- Field 2: Password with Error State -->
<div class="flex flex-col space-y-space-sm">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Parol</label>
</div>
<div class="relative w-full h-12 bg-error-container/30 rounded-xl flex items-center pl-space-lg pr-12 transition-colors">
<input class="w-full h-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder-secondary focus:outline-none" id="password" name="password" placeholder="Parolni kiriting" type="password" value="••••••••••••">
<button aria-label="Parolni ko'rsatish" class="absolute right-2 w-9 h-9 rounded-lg flex items-center justify-center text-secondary hover:text-on-surface focus:outline-none transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon">visibility_off</span>
</button>
</div>
<!-- Inline Error Message -->
<div class="flex items-start space-x-1.5 pt-1 text-error">
<span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">cancel</span>
<span class="font-body-sm text-body-sm leading-tight text-error">
            Telefon raqam yoki parol noto‘g‘ri. 2 ta urinish qoldi
          </span>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors focus:outline-none" href="#">
          Parolni unutdingizmi?
        </a>
</div>
<!-- Single Primary Action -->
<div class="pt-2">
<button class="w-full h-12 bg-primary-container hover:bg-primary active:bg-on-primary-fixed-variant text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center transition-colors focus:outline-none" type="submit">
          Kirish
        </button>
</div>
</form>
<!-- Bottom Secondary Registration Link -->
<div class="w-full text-center mt-space-xl pb-space-lg">
<p class="font-body-md text-body-md text-secondary">
        Akkauntingiz yo‘qmi? 
        <a class="font-label-md text-label-md text-primary-container hover:text-primary hover:underline cursor-pointer transition-colors ml-1 focus:outline-none" href="#" onclick="window.location.href='#register';">Ro‘yxatdan o‘tish</a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }
  })();
</script></main>

</body></html>
