<script>
  (function() {
    const container = document.getElementById('otp-container');
    if (!container) return;
    const inputs = Array.from(container.querySelectorAll('input'));

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        
        inputs.forEach(el => el.classList.remove('ring-1', 'ring-primary-container'));
        
        if (e.target.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].classList.add('ring-1', 'ring-primary-container');
        } else {
          e.target.classList.add('ring-1', 'ring-primary-container');
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs.forEach(el => el.classList.remove('ring-1', 'ring-primary-container'));
          inputs[index - 1].focus();
          inputs[index - 1].classList.add('ring-1', 'ring-primary-container');
        }
      });

      input.addEventListener('focus', () => {
        inputs.forEach(el => el.classList.remove('ring-1', 'ring-primary-container'));
        input.classList.add('ring-1', 'ring-primary-container');
      });
    });

    let timeLeft = 48;
    const countdownEl = document.getElementById('countdown-text');
    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timer);
        if (countdownEl) {
          countdownEl.textContent = 'Kodni qayta yuborish';
          countdownEl.className = 'font-label-md text-label-md text-primary-container cursor-pointer select-none';
        }
      } else if (countdownEl) {
        const formatted = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        countdownEl.textContent = 'Kodni qayta yuborish (0:' + formatted + ')';
      }
    }, 1000);
  })();
