<script>
  (function initPhoneMask() {
    const input = document.getElementById('phone-input');
    const container = document.getElementById('input-container');
    const hint = document.getElementById('phone-hint');
    const submitBtn = document.getElementById('submit-btn');

    if (!input || !container) return;

    // Focus state handling
    input.addEventListener('focus', () => {
      container.classList.remove('bg-surface-container-lowest');
      container.classList.add('bg-surface-container-lowest', 'bg-primary-container/5');
    });

    input.addEventListener('blur', () => {
      container.classList.remove('bg-primary-container/5');
    });

    // Formatting mask for Uzbek numbers: XX XXX XX XX
    input.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 9) value = value.substring(0, 9);

      let formatted = '';
      if (value.length > 0) formatted += value.substring(0, 2);
      if (value.length > 2) formatted += ' ' + value.substring(2, 5);
      if (value.length > 5) formatted += ' ' + value.substring(5, 7);
      if (value.length > 7) formatted += ' ' + value.substring(7, 9);

      e.target.value = formatted;

      // Reset error state on typing
      if (hint && hint.classList.contains('text-error')) {
        hint.textContent = 'Tasdiqlash kodi ushbu raqamga SMS orqali yuboriladi';
        hint.classList.remove('text-error');
        hint.classList.add('text-secondary');
      }
    });

    window.validateForm = function() {
      const rawValue = input.value.replace(/\s+/g, '');
      if (rawValue.length < 9) {
        if (hint) {
          hint.textContent = 'Iltimos, to‘liq 9 xonali telefon raqamini kiriting';
          hint.classList.remove('text-secondary');
          hint.classList.add('text-error');
        }
        input.focus();
        return false;
      }
      
      // Simulate state progression
      submitBtn.disabled = true;
      submitBtn.textContent = 'Tekshirilmoqda...';
      submitBtn.classList.add('opacity-75');

      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Davom etish';
        submitBtn.classList.remove('opacity-75');
      }, 1000);

      return true;
    };
  })();
</script></main>
