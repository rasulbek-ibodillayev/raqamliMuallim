<script>
  // Simple interactive toggle handler for settings
  document.querySelectorAll('.toggle-btn').forEach(function(toggle) {
    toggle.addEventListener('click', function() {
      var isChecked = this.getAttribute('aria-checked') === 'true';
      var knob = this.querySelector('div');
      
      if (isChecked) {
        this.setAttribute('aria-checked', 'false');
        this.classList.remove('bg-primary-container');
        this.classList.add('bg-surface-container-highest');
        knob.classList.remove('translate-x-5');
        knob.classList.add('translate-x-0');
      } else {
        this.setAttribute('aria-checked', 'true');
        this.classList.remove('bg-surface-container-highest');
        this.classList.add('bg-primary-container');
        knob.classList.remove('translate-x-0');
        knob.classList.add('translate-x-5');
      }
    });
  });
