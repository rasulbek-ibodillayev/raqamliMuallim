{# Interfeys tili (ochiladigan ro'yxat). ?til=uz|ru|en sessiyada eslab qolinadi (app/i18n.py). Tarjimalar: scripts/translate.py #}
<form class="lang-switch" method="get" action="">
  <select class="select select-sm" name="til" aria-label="{{ _('Interfeys tili') }}" data-autosubmit>
    {% for code, name in langs.items() %}
    <option value="{{ code }}" lang="{{ code }}" {{ 'selected' if current_lang == code }}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button class="btn btn-ghost btn-sm" type="submit">{{ _("Saqlash") }}</button></noscript>
</form>
