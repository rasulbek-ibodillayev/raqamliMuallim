{# Interfeys tili. ?til=uz|ru|en|kaa sessiyada eslab qolinadi (app/i18n.py). Tarjimalar: scripts/translate.py #}
<div class="seg lang-switch" role="group" aria-label="{{ _('Interfeys tili') }}">
  {% for code, name in langs.items() %}
  <a class="{{ 'active' if current_lang == code }}" href="?til={{ code }}" hreflang="{{ code }}" lang="{{ code }}" title="{{ name }}" {{ 'aria-current=true' if current_lang == code }}>{{ lang_short[code] }}<span class="sr-only"> — {{ name }}</span></a>
  {% endfor %}
</div>
