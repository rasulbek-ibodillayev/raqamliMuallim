{# Interfeys tili. ?til=uz|ru sessiyada eslab qolinadi (app/i18n.py). Rus tili tarjimasi hali to'liq emas. #}
<div class="seg lang-switch" role="group" aria-label="{{ _('Interfeys tili') }}">
  {% for code, name in langs.items() %}
  <a class="{{ 'active' if current_lang == code }}" href="?til={{ code }}" hreflang="{{ code }}" lang="{{ code }}" {{ 'aria-current=true' if current_lang == code }}>{{ "UZ" if code == "uz" else "RU" }}<span class="sr-only"> — {{ name }}</span></a>
  {% endfor %}
</div>
